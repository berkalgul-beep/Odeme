<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Rice Art Ödeme</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:#ff6a00;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

.logo{
    width:240px;
    height:240px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid #fff;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    margin-bottom:30px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:20px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.text{
    text-align:left;
    flex:1;
    color:#000;
    word-break:break-word;
}

.name{
    font-size:30px;
    font-weight:700;
}

.iban{
    font-size:20px;
    font-weight:600;
    line-height:1.4;
}

.copy-btn{
    border:none;
    background:none;
    cursor:pointer;
    min-width:70px;
}

.copy-icon{
    font-size:30px;
}

.copy-label{
    font-size:12px;
    color:#555;
    margin-top:4px;
}

.toast{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    color:#fff;
    padding:12px 20px;
    border-radius:999px;
    display:none;
}

@media(max-width:600px){

.name{
    font-size:22px;
}

.iban{
    font-size:16px;
}

.logo{
    width:200px;
    height:200px;
}
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="card">
    <div class="text">
        <div class="name">Berk Algül</div>
    </div>

    <button class="copy-btn" onclick="copyName()">
        <div class="copy-icon">📋</div>
        <div class="copy-label">Kopyala</div>
    </button>
</div>

<div class="card">
    <div class="text">
        <div class="iban">
            TR36 0001 5001 5800 7310 4518 24
        </div>
    </div>

    <button class="copy-btn" onclick="copyIban()">
        <div class="copy-icon">📋</div>
        <div class="copy-label">Kopyala</div>
    </button>
</div>

</div>

<div id="toast" class="toast">
Kopyalandı ✓
</div>

<script>
function showToast(){
    const toast=document.getElementById("toast");
    toast.style.display="block";

    setTimeout(()=>{
        toast.style.display="none";
    },1500);
}

function copyName(){
    navigator.clipboard.writeText("Berk Algül");
    showToast();
}

function copyIban(){
    navigator.clipboard.writeText("TR36 0001 5001 5800 7310 4518 24");
    showToast();
}
</script>

</body>
</html>
